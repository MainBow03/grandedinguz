        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (type === 'heartbeat') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(80, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.9, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                } else if (type === 'elimination') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(250, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 1.2);
                    gain.gain.setValueAtTime(1.0, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 1.2);
                } else if (type === 'saved') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.setValueAtTime(660, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.6, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch(e) {}
        };

        const highlightNamesInText = (rawText, aliveCast) => {
            let processedText = rawText;
            const sortedCast = [...aliveCast].sort((a, b) => b.name.length - a.name.length);
            
            sortedCast.forEach(c => {
                const regex = new RegExp(`\\b${c.name}\\b`, 'gi');
                const replacement = `
                    <span class="inline-flex flex-col items-center justify-center mx-1.5 align-middle group cursor-pointer translate-y-1">
                        <img src="${c.img}" alt="${c.name}" onerror="this.onerror=null;this.src='https://placehold.co/100x100/4c1d95/ffffff?text=${c.name}';" class="w-8 h-8 md:w-10 md:h-10 rounded-lg object-cover border border-purple-500/50 shadow-sm group-hover:scale-110 group-hover:border-purple-400 transition-all duration-300" />
                        <span class="text-[9px] md:text-[10px] font-extrabold text-gray-300 mt-0.5 leading-none uppercase tracking-tight group-hover:text-white transition-colors">${c.name}</span>
                    </span>
                `.trim().replace(/\n\s+/g, ' '); 
                processedText = processedText.replace(regex, replacement);
            });
            
            return processedText.replace(/<b>\s*(<span[^>]+>.*?<\/span>)\s*<\/b>/gi, '$1');
        };

        const generateEpisodeStory = async (aliveCast, immuneChar, episodeNum, pastEpisodes = [], apiKey = "") => {
            const aliveNames = aliveCast.map(c => c.name).join(', ');
            const historyContext = pastEpisodes.length > 0 
                ? pastEpisodes.slice(-3).map((ep) => `Riassunto Episodio precedente:\n${ep.replace(/<[^>]*>?/gm, '')}`).join("\n\n")
                : "Prima puntata. I concorrenti varcano la Porta Rossa del Grande Fratello.";

            let systemPrompt = `Sei l'autore e la voce del "Grande Fratello". 
            Cast: ${aliveNames}. 
            Immune: ${immuneChar.name}. 
            Storico: ${historyContext}
            Scrivi il racconto per la Settimana ${episodeNum}. 
            FORMATO: Usa solo tag <p> e <i>. NESSUN tag <b> sui nomi propri. Nessun tag \`\`\`html.`;

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

            try {
                if (!apiKey || apiKey.trim() === "") throw new Error("API Key mancante");
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: systemPrompt }] }],
                        generationConfig: { temperature: 0.8 }
                    })
                });
                
                if (!response.ok) throw new Error("API Error");
                const result = await response.json();
                if (result.candidates?.[0]?.content?.parts?.[0]?.text) {
                    let text = result.candidates[0].content.parts[0].text;
                    return highlightNamesInText(text.replace(/```html/gi, '').replace(/```/g, ''), aliveCast);
                }
            } catch (e) {
                console.log("Fallback storia locale...", e.message);
            }

            const shuffledCast = [...aliveCast].sort(() => 0.5 - Math.random());
            const p1 = shuffledCast[0] ? shuffledCast[0].name : immuneChar.name;
            const p2 = shuffledCast[1] ? shuffledCast[1].name : p1;
            
            const fallbackText = `<p>La tensione nella Casa è altissima!</p>
            <p>Il vero terremoto della settimana è stato lo scontro in Confessionale tra ${p1} e ${p2}.</p>
            <p>Nel frattempo, ${immuneChar.name} ha saputo giocare d'astuzia, aggiudicandosi l'Immunità per questa nomination!</p>`;

            return highlightNamesInText(fallbackText, aliveCast);
        };

        function RealityShowGame() {
            const { useState, useEffect, useRef } = React;

            // ID utente persistente per evitare disallineamento durante il caricamento di Auth
            const getOrCreatePersistentUid = () => {
                let pid = localStorage.getItem('game_user_uid');
                if (!pid) {
                    pid = 'user_' + Math.random().toString(36).substring(2, 9);
                    localStorage.setItem('game_user_uid', pid);
                }
                return pid;
            };

            const [user, setUser] = useState({ uid: getOrCreatePersistentUid() });
            const [nickname, setNickname] = useState(localStorage.getItem('game_nickname') || 'Giocatore');
            const [geminiApiKey, setGeminiApiKey] = useState(localStorage.getItem('geminiApiKey') || '');
            const [lobbyId, setLobbyId] = useState(null);
            const [lobbyData, setLobbyData] = useState(null);
            const [view, setView] = useState('menu');
            const [onlineStatus, setOnlineStatus] = useState('connecting'); // 'online', 'offline', 'connecting'

            const [castMode, setCastMode] = useState('random'); 
            const [customSize, setCustomSize] = useState(12);
            const [manualSelectedIds, setManualSelectedIds] = useState([]);

            // Autenticazione Firebase e Stato Online
            useEffect(() => {
                if (isFirebaseAvailable && auth) {
                    auth.signInAnonymously()
                        .then((cred) => {
                            setOnlineStatus('online');
                            if (cred.user) {
                                setUser({ uid: cred.user.uid });
                                localStorage.setItem('game_user_uid', cred.user.uid);
                            }
                        })
                        .catch(err => {
                            console.warn("Errore Auth Firebase:", err);
                            setOnlineStatus('offline');
                        });
                } else {
                    setOnlineStatus('offline');
                }
            }, []);

            const updateLobbyState = async (updates) => {
                if (db && lobbyId && onlineStatus === 'online') {
                    try {
                        await db.collection('lobbies').doc(lobbyId).update(updates);
                    } catch(e) {
                        console.error("Errore aggiornamento Firebase:", e);
                        alert("Errore di connessione a Firebase: " + e.message);
                    }
                } else {
                    setLobbyData(prev => ({ ...prev, ...updates }));
                }
            };

            // Listener per aggiornamenti stanza in tempo reale
            useEffect(() => {
                if (!isFirebaseAvailable || !db || !lobbyId) return;
                
                const unsubscribe = db.collection('lobbies').doc(lobbyId).onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        setLobbyData(data);
                        
                        if (data.status === 'playing' && view !== 'game') {
                            setView('game');
                        }
                    } else {
                        alert("La stanza è stata chiusa o non esiste più.");
                        leaveLobby();
                    }
                }, (error) => {
                    console.error("Errore snapshot Firebase:", error);
                });
                
                return () => unsubscribe();
            }, [lobbyId, view]);

            const createLobby = async () => {
                if (!nickname.trim()) return alert("Inserisci un nickname!");
                localStorage.setItem('game_nickname', nickname);
                
                const newId = Math.random().toString(36).substring(2, 8).toUpperCase();
                const newLobby = {
                    id: newId,
                    name: `Lobby di ${nickname}`,
                    host: user.uid,
                    status: 'waiting',
                    players: [{ id: user.uid, name: nickname }],
                    cast: [],
                    eliminated: [],
                    pastEpisodes: [],
                    gameState: 'lobby',
                    currentEpisodeNum: 1,
                    currentEpisodeText: '',
                    immuneId: null,
                    nominationVotes: {},
                    nominees: [],
                    publicVotes: {},
                    eliminationScript: [],
                    scriptIndex: 0,
                    readyForNomination: []
                };

                if (db && onlineStatus === 'online') {
                    try {
                        await db.collection('lobbies').doc(newId).set(newLobby);
                        setLobbyId(newId);
                        setView('lobby');
                    } catch(e) {
                        alert("Impossibile creare la stanza online. Verifica la tua connessione o le regole di Firebase. Errore: " + e.message);
                    }
                } else {
                    setLobbyData(newLobby);
                    setLobbyId(newId);
                    setView('lobby');
                }
            };

            const joinLobby = async (code) => {
                if (!nickname.trim()) return alert("Inserisci un nickname!");
                if (!code) return alert("Inserisci un codice valido!");
                localStorage.setItem('game_nickname', nickname);

                const codeUpper = code.toUpperCase().trim();
                
                if (db && onlineStatus === 'online') {
                    try {
                        const docRef = db.collection('lobbies').doc(codeUpper);
                        const docSnap = await docRef.get();
                        
                        if (docSnap.exists) {
                            const data = docSnap.data();
                            const isAlreadyIn = data.players.some(p => p.id === user.uid);
                            
                            if (!isAlreadyIn) {
                                const newPlayers = [...data.players, { id: user.uid, name: nickname }];
                                await docRef.update({ players: newPlayers });
                            }
                            setLobbyId(codeUpper);
                            setView('lobby');
                        } else {
                            alert("Stanza non trovata! Verifica il codice.");
                        }
                    } catch(e) {
                        alert("Errore nell'unirsi alla stanza: " + e.message);
                    }
                } else {
                    alert("Firebase non è connesso. Modalità online non disponibile.");
                }
            };

            const leaveLobby = () => {
                setLobbyId(null);
                setLobbyData(null);
                setView('menu');
            };

            const startCustomGame = async () => {
                if (user.uid !== lobbyData.host) return alert("Solo l'Host può iniziare il gioco!");

                let selectedCast = [];
                if (castMode === 'random') {
                    const count = Math.min(Math.max(3, Number(customSize) || 12), FULL_CAST.length);
                    const shuffled = [...FULL_CAST].sort(() => 0.5 - Math.random());
                    selectedCast = shuffled.slice(0, count);
                } else {
                    selectedCast = FULL_CAST.filter(c => manualSelectedIds.includes(c.id));
                    if (selectedCast.length < 3) {
                        alert("Seleziona almeno 3 concorrenti!");
                        return;
                    }
                }

                const updated = {
                    status: 'playing',
                    cast: selectedCast,
                    gameState: 'episode_generation',
                    currentEpisodeNum: 1
                };
                
                await updateLobbyState(updated);
                generateNextEpisode(selectedCast, { ...lobbyData, ...updated });
            };

            const generateNextEpisode = async (currentCast, currentLobby) => {
                const immuneChar = currentCast[Math.floor(Math.random() * currentCast.length)];
                const text = await generateEpisodeStory(currentCast, immuneChar, currentLobby.currentEpisodeNum, currentLobby.pastEpisodes, geminiApiKey);

                await updateLobbyState({
                    gameState: 'episode_reading',
                    currentEpisodeText: text,
                    pastEpisodes: [...(currentLobby.pastEpisodes || []), text], 
                    immuneId: immuneChar.id,
                    nominationVotes: {},
                    nominees: [],
                    publicVotes: {},
                    eliminationScript: [],
                    scriptIndex: 0,
                    readyForNomination: []
                });
            };

            const processHouseNominations = () => {
                if (user.uid !== lobbyData.host) return;

                const currentCast = lobbyData.cast;
                const nonImmuneCast = currentCast.filter(c => c.id !== lobbyData.immuneId);
                const nominationTallies = {};

                currentCast.forEach(c => nominationTallies[c.id] = 0);

                currentCast.forEach(voterChar => {
                    let validTargets = nonImmuneCast.filter(t => t.id !== voterChar.id);
                    if (validTargets.length === 0) validTargets = nonImmuneCast;
                    if (validTargets.length > 0) {
                        const randomTarget = validTargets[Math.floor(Math.random() * validTargets.length)];
                        nominationTallies[randomTarget.id] = (nominationTallies[randomTarget.id] || 0) + 1;
                    }
                });

                const sortedCast = [...nonImmuneCast].sort((a, b) => nominationTallies[b.id] - nominationTallies[a.id]);
                const selectedNominees = sortedCast.slice(0, Math.min(3, sortedCast.length));

                updateLobbyState({
                    nominees: selectedNominees,
                    nominationTallies: nominationTallies,
                    gameState: 'public_voting'
                });
            };

            const submitPublicVote = async (charId) => {
                const newPublicVotes = { ...(lobbyData.publicVotes || {}), [user.uid]: charId };
                await updateLobbyState({ publicVotes: newPublicVotes });

                if (user.uid === lobbyData.host) {
                    closeTelevoto(newPublicVotes);
                }
            };

            const closeTelevoto = (publicVotesObj) => {
                const voteCounts = {};
                lobbyData.nominees.forEach(c => voteCounts[c.id] = 0);

                Object.values(publicVotesObj).forEach(votedId => {
                    if (voteCounts[votedId] !== undefined) voteCounts[votedId]++;
                });

                const sortedNominees = [...lobbyData.nominees].sort((a, b) => voteCounts[b.id] - voteCounts[a.id]);
                const maxVotes = voteCounts[sortedNominees[0].id];
                const tiedForFirst = sortedNominees.filter(c => voteCounts[c.id] === maxVotes);
                const trulySaved = sortedNominees.filter(c => voteCounts[c.id] < maxVotes);
                
                const isTie = tiedForFirst.length > 1;
                const eliminatedChar = isTie ? tiedForFirst[Math.floor(Math.random() * tiedForFirst.length)] : tiedForFirst[0];

                const script = [
                    { type: 'text', content: "🔔 Il televoto del pubblico è UFFICIALMENTE CHIUSO!", sound: null },
                    { type: 'text', content: `I concorrenti a rischio sono: <b>${lobbyData.nominees.map(c => c.name).join(', ')}</b>.`, sound: 'heartbeat' },
                    { type: 'text', content: "Ho la busta con il verdetto definitivo...", sound: 'heartbeat' }
                ];

                if (isTie) {
                    if (trulySaved.length > 0) {
                        script.push({ type: 'text', content: `✨ Il pubblico ha deciso di SALVARE... ${trulySaved.map(c => `<b>${c.name.toUpperCase()}</b>`).join(' e ')}!`, sound: 'saved' });
                    }
                    script.push({ type: 'text', content: `Pareggio al televoto! Il conduttore deve prendere la decisione finale...`, sound: 'heartbeat' });
                    script.push({ type: 'text', content: `💥 <b>${eliminatedChar.name.toUpperCase()}</b>... SEI ELIMINATO/A!`, sound: 'elimination' });
                } else {
                    const savedNominees = sortedNominees.filter(c => c.id !== eliminatedChar.id);
                    if (savedNominees.length > 0) {
                        script.push({ type: 'text', content: `✨ Salvo/i: <b>${savedNominees.map(s => s.name.toUpperCase()).join(', ')}</b>!`, sound: 'saved' });
                    }
                    script.push({ type: 'text', content: `💥 <b>${eliminatedChar.name.toUpperCase()}</b>... SEI ELIMINATO/A!`, sound: 'elimination' });
                }

                updateLobbyState({
                    gameState: 'elimination_reveal',
                    eliminationScript: script,
                    scriptIndex: 0,
                    pendingEliminatedId: eliminatedChar.id
                });
            };

            useEffect(() => {
                let timer;
                if (lobbyData && lobbyData.gameState === 'elimination_reveal' && user.uid === lobbyData.host) {
                    if (lobbyData.scriptIndex < lobbyData.eliminationScript.length - 1) {
                        timer = setTimeout(() => {
                            updateLobbyState({ scriptIndex: lobbyData.scriptIndex + 1 });
                        }, 3000);
                    }
                }
                
                if (lobbyData && lobbyData.gameState === 'elimination_reveal' && lobbyData.eliminationScript) {
                    const currentStep = lobbyData.eliminationScript[lobbyData.scriptIndex];
                    if (currentStep && currentStep.sound) {
                        playSound(currentStep.sound);
                    }
                }

                return () => clearTimeout(timer);
            }, [lobbyData?.gameState, lobbyData?.scriptIndex]);

            const proceedToNextEpisode = () => {
                if (user.uid !== lobbyData.host) return;

                const eliminatedChar = lobbyData.cast.find(c => c.id === lobbyData.pendingEliminatedId);
                const newCast = lobbyData.cast.filter(c => c.id !== lobbyData.pendingEliminatedId);
                const newEliminated = [...(lobbyData.eliminated || []), eliminatedChar];

                if (newCast.length <= 1) {
                    updateLobbyState({ gameState: 'finished', cast: newCast, eliminated: newEliminated });
                } else {
                    const updated = {
                        gameState: 'episode_generation',
                        cast: newCast,
                        eliminated: newEliminated,
                        currentEpisodeNum: lobbyData.currentEpisodeNum + 1
                    };
                    updateLobbyState(updated);
                    generateNextEpisode(newCast, { ...lobbyData, ...updated });
                }
            };

            const renderMenu = () => (
                <div className="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-black text-white p-6">
                    {/* Badge Stato Connessione */}
                    <div className="absolute top-4 right-4 flex items-center gap-2 px-3 py-1.5 rounded-full bg-black/40 border border-white/10 text-xs">
                        {onlineStatus === 'online' ? (
                            <>
                                <Wifi className="w-4 h-4 text-green-400" />
                                <span className="text-green-300 font-semibold">Online (Firebase)</span>
                            </>
                        ) : onlineStatus === 'connecting' ? (
                            <>
                                <RefreshCw className="w-4 h-4 text-yellow-400 animate-spin" />
                                <span className="text-yellow-300 font-semibold">Connessione...</span>
                            </>
                        ) : (
                            <>
                                <WifiOff className="w-4 h-4 text-red-400" />
                                <span className="text-red-300 font-semibold">Offline / Locale</span>
                            </>
                        )}
                    </div>

                    <div className="bg-white/10 p-8 rounded-3xl backdrop-blur-md shadow-2xl max-w-md w-full border border-white/20 text-center">
                        <Crown className="w-16 h-16 mx-auto mb-4 text-yellow-400 drop-shadow-[0_0_15px_rgba(250,204,21,0.8)]" />
                        <h1 className="text-4xl font-extrabold mb-2 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-pink-500">REALITY SHOW</h1>
                        <p className="text-gray-300 mb-6 text-sm">Crea o unisciti a una stanza multiplayer in tempo reale!</p>

                        <div className="space-y-4 mb-6">
                            <input 
                                type="text" 
                                placeholder="Il tuo Nickname..." 
                                className="w-full bg-black/30 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all"
                                value={nickname}
                                onChange={(e) => setNickname(e.target.value)}
                            />
                            
                            <div className="text-left">
                                <label className="text-xs text-purple-300 font-bold ml-1 mb-1 block">Google Gemini API Key (Opzionale):</label>
                                <input 
                                    type="password" 
                                    placeholder="Chiave API Gemini per racconti dinamici" 
                                    className="w-full bg-black/50 border border-purple-500/30 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all text-sm"
                                    value={geminiApiKey}
                                    onChange={(e) => {
                                        setGeminiApiKey(e.target.value);
                                        localStorage.setItem('geminiApiKey', e.target.value);
                                    }}
                                />
                            </div>
                        </div>

                        <div className="space-y-4 border-t border-white/10 pt-6">
                            <button onClick={createLobby} className="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 py-3 rounded-xl font-bold shadow-lg transform hover:scale-105 transition-all">
                                <Play className="w-5 h-5" /> Crea Nuova Stanza
                            </button>
                            
                            <div className="flex gap-2">
                                <input id="joinCode" type="text" placeholder="Codice Stanza" className="w-2/3 bg-black/30 border border-white/20 rounded-xl px-4 py-3 text-white text-center uppercase font-mono" />
                                <button onClick={() => joinLobby(document.getElementById('joinCode').value)} className="w-1/3 bg-white/20 hover:bg-white/30 py-3 rounded-xl font-bold transition-all">
                                    Unisciti
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const renderLobbyRoom = () => {
                if (!lobbyData) return null;
                const isHost = user.uid === lobbyData.host;

                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-gray-900 text-white p-6">
                        <div className="bg-gray-800 p-8 rounded-3xl shadow-2xl max-w-2xl w-full border border-gray-700">
                            <div className="flex justify-between items-start mb-6">
                                <div>
                                    <h2 className="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600">{lobbyData.name}</h2>
                                    <p className="text-gray-400 mt-1">Codice Stanza da condividere: <span className="font-mono text-yellow-300 bg-black/60 px-3 py-1 rounded text-lg border border-yellow-500/30 font-bold">{lobbyData.id}</span></p>
                                </div>
                                <button onClick={leaveLobby} className="text-red-400 hover:text-red-300 flex items-center gap-1 bg-red-950/40 px-3 py-1.5 rounded-lg border border-red-800/40"><LogOut className="w-4 h-4"/> Esci</button>
                            </div>

                            <div className="mb-8">
                                <h3 className="text-xl font-semibold mb-4 border-b border-gray-700 pb-2 flex items-center justify-between">
                                    <span>Giocatori Connessi ({lobbyData.players.length})</span>
                                    <span className="text-xs text-purple-400 font-normal">Sincronizzazione attiva</span>
                                </h3>
                                <div className="flex flex-wrap gap-3">
                                    {lobbyData.players.map(p => (
                                        <div key={p.id} className="bg-gray-700/60 px-4 py-2 rounded-full flex items-center gap-2 border border-gray-600 shadow">
                                            {p.id === lobbyData.host && <Crown className="w-4 h-4 text-yellow-400"/>}
                                            <span className="font-semibold">{p.name}</span>
                                            {p.id === user.uid && <span className="text-xs text-purple-300 font-bold">(Tu)</span>}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {isHost ? (
                                <div className="bg-purple-900/30 p-6 rounded-2xl border border-purple-500/30 space-y-6">
                                    <h3 className="text-xl font-bold text-purple-200 text-center">Configura il Cast del Reality</h3>
                                    
                                    <div className="flex bg-black/40 p-1.5 rounded-xl border border-purple-500/30">
                                        <button 
                                            onClick={() => setCastMode('random')}
                                            className={`flex-1 py-2.5 rounded-lg font-bold transition-all text-sm flex items-center justify-center gap-2 ${castMode === 'random' ? 'bg-purple-600 text-white shadow-lg' : 'text-gray-400 hover:text-white'}`}
                                        >
                                            🎲 Casuale
                                        </button>
                                        <button 
                                            onClick={() => {
                                                setCastMode('manual');
                                                if (manualSelectedIds.length === 0) setManualSelectedIds(FULL_CAST.map(c => c.id));
                                            }}
                                            className={`flex-1 py-2.5 rounded-lg font-bold transition-all text-sm flex items-center justify-center gap-2 ${castMode === 'manual' ? 'bg-purple-600 text-white shadow-lg' : 'text-gray-400 hover:text-white'}`}
                                        >
                                            🖐️ Manuale
                                        </button>
                                    </div>

                                    {castMode === 'random' ? (
                                        <div className="space-y-4">
                                            <div className="flex justify-between items-center text-sm">
                                                <label className="font-semibold text-gray-300">Numero Concorrenti:</label>
                                                <span className="font-mono text-xl font-bold text-purple-300 bg-purple-950/80 px-3 py-1 rounded-lg border border-purple-500/40">
                                                    {customSize} / {FULL_CAST.length}
                                                </span>
                                            </div>
                                            <input 
                                                type="range" 
                                                min="3" 
                                                max={FULL_CAST.length} 
                                                value={customSize} 
                                                onChange={(e) => setCustomSize(Number(e.target.value))}
                                                className="w-full accent-purple-500 cursor-pointer h-2 bg-gray-700 rounded-lg"
                                            />
                                        </div>
                                    ) : (
                                        <div className="space-y-4">
                                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-48 overflow-y-auto custom-scrollbar p-2 bg-black/40 rounded-xl border border-gray-700">
                                                {FULL_CAST.map(c => {
                                                    const isSelected = manualSelectedIds.includes(c.id);
                                                    return (
                                                        <div 
                                                            key={c.id}
                                                            onClick={() => {
                                                                setManualSelectedIds(prev => isSelected ? prev.filter(id => id !== c.id) : [...prev, c.id]);
                                                            }}
                                                            className={`flex items-center gap-2 p-2 rounded-xl cursor-pointer transition-all border select-none ${isSelected ? 'bg-purple-900/70 border-purple-400 text-white' : 'bg-gray-800/40 border-gray-700/50 text-gray-400 opacity-60'}`}
                                                        >
                                                            <img src={c.img} alt={c.name} className="w-8 h-8 rounded-lg object-cover" />
                                                            <span className="text-xs font-bold truncate">{c.name}</span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    <button 
                                        onClick={startCustomGame} 
                                        className="w-full py-4 rounded-xl font-extrabold text-lg shadow-xl flex items-center justify-center gap-2 bg-gradient-to-r from-purple-600 via-pink-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white transition-all hover:scale-[1.02]"
                                    >
                                        <Play className="w-5 h-5 fill-current" /> Avvia Programma TV
                                    </button>
                                </div>
                            ) : (
                                <div className="bg-purple-950/40 p-6 rounded-2xl border border-purple-500/30 text-center animate-pulse">
                                    <p className="text-purple-300 font-semibold text-lg">In attesa che l'Host avvii lo show...</p>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const renderGame = () => {
                if (!lobbyData) return null;
                const { gameState, currentEpisodeNum, cast, eliminated, currentEpisodeText, immuneId, nominees, publicVotes, scriptIndex, eliminationScript } = lobbyData;

                return (
                    <div className="flex flex-col h-screen bg-gray-900 text-white overflow-hidden">
                        {/* Cast Bar Top */}
                        <div className="bg-gray-800/90 backdrop-blur-md border-b border-gray-700 p-3 shadow-lg">
                            <div className="max-w-6xl mx-auto flex items-center justify-between gap-2 mb-2">
                                <div className="flex items-center gap-2">
                                    <Users className="w-5 h-5 text-purple-400" />
                                    <span className="font-bold text-sm text-purple-300">Concorrenti nella Casa ({cast.length})</span>
                                </div>
                                {eliminated?.length > 0 && (
                                    <div className="text-xs text-red-400 font-semibold flex items-center gap-1">
                                        <Skull className="w-4 h-4" /> Eliminati: {eliminated.length}
                                    </div>
                                )}
                            </div>
                            <div className="flex items-center gap-3 overflow-x-auto pb-2 custom-scrollbar max-w-6xl mx-auto">
                                {cast.map(c => {
                                    const isImmune = c.id === immuneId;
                                    const isNominated = nominees && nominees.some(n => n.id === c.id);
                                    return (
                                        <div key={c.id} className="flex-shrink-0 flex flex-col items-center group relative">
                                            <div className={`relative w-12 h-12 rounded-xl overflow-hidden border-2 ${isImmune ? 'border-yellow-400 ring-2 ring-yellow-400/50' : isNominated ? 'border-red-500 ring-2 ring-red-500/80 shadow-[0_0_12px_rgba(239,68,68,0.9)]' : 'border-gray-600'}`}>
                                                <img src={c.img} alt={c.name} className="w-full h-full object-cover" />
                                                {isImmune && (
                                                    <div className="absolute top-0 right-0 bg-yellow-500 p-0.5 rounded-bl z-10">
                                                        <Crown className="w-3 h-3 text-black fill-black" />
                                                    </div>
                                                )}
                                            </div>
                                            <span className="text-[10px] font-medium truncate max-w-[56px] text-center mt-1 text-gray-300">
                                                {c.name}
                                            </span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Main Stage */}
                        <div className="flex-1 flex flex-col h-full overflow-y-auto relative p-6 max-w-4xl mx-auto w-full">
                            {gameState === 'episode_generation' && (
                                <div className="flex flex-col items-center justify-center my-auto text-center">
                                    <RefreshCw className="w-12 h-12 text-purple-500 animate-spin mb-4" />
                                    <h3 className="text-xl font-bold">Generazione Episodio {currentEpisodeNum}...</h3>
                                </div>
                            )}

                            {gameState === 'episode_reading' && (
                                <div className="space-y-6 my-auto">
                                    <h2 className="text-2xl font-bold text-purple-400">Settimana {currentEpisodeNum} - Diretta TV</h2>
                                    <div className="story-text bg-gray-800 p-5 rounded-2xl border border-gray-700 font-serif text-sm md:text-base text-gray-200" dangerouslySetInnerHTML={{__html: currentEpisodeText}}></div>
                                    
                                    <div className="bg-gray-800/80 p-4 rounded-xl border border-gray-700 flex flex-col items-center gap-3 mt-8">
                                        <p className="text-gray-300 font-semibold text-sm">
                                            Giocatori pronti: <span className="text-white font-bold">{lobbyData.readyForNomination?.length || 0} / {lobbyData.players.length}</span>
                                        </p>
                                        <button 
                                            onClick={() => {
                                                const currentReady = lobbyData.readyForNomination || [];
                                                let newReady = currentReady.includes(user.uid)
                                                    ? currentReady.filter(id => id !== user.uid)
                                                    : [...currentReady, user.uid];

                                                if (newReady.length >= lobbyData.players.length) {
                                                    updateLobbyState({ gameState: 'house_nomination', readyForNomination: [] });
                                                } else {
                                                    updateLobbyState({ readyForNomination: newReady });
                                                }
                                            }} 
                                            className={`w-full py-4 rounded-xl font-bold text-xl transition-all shadow-lg flex justify-center items-center gap-2 ${
                                                (lobbyData.readyForNomination || []).includes(user.uid)
                                                ? 'bg-green-600 text-white'
                                                : 'bg-gradient-to-r from-purple-600 to-indigo-600'
                                            }`}
                                        >
                                            {(lobbyData.readyForNomination || []).includes(user.uid) ? 'Pronto (In attesa...)' : 'Sono Pronto per le Nomination!'}
                                        </button>
                                    </div>
                                </div>
                            )}

                            {gameState === 'house_nomination' && (
                                <div className="space-y-6 my-auto text-center bg-gray-800 p-8 rounded-3xl border border-gray-700 shadow-2xl">
                                    <Users className="w-16 h-16 text-purple-400 mx-auto" />
                                    <h3 className="text-3xl font-extrabold text-purple-300">CONFESSIONALE SEGRETO</h3>
                                    <p className="text-gray-300 max-w-xl mx-auto">I concorrenti stanno votando per mandare i propri compagni al televoto!</p>
                                    
                                    {user.uid === lobbyData.host ? (
                                        <button onClick={processHouseNominations} className="w-full py-4 bg-gradient-to-r from-pink-600 to-purple-600 rounded-xl font-bold text-xl shadow-lg flex items-center justify-center gap-2">
                                            Calcola Nomination della Casa <ArrowRight />
                                        </button>
                                    ) : (
                                        <p className="text-purple-400 mt-4 animate-pulse">L'host sta raccogliendo i voti della casa...</p>
                                    )}
                                </div>
                            )}

                            {gameState === 'public_voting' && (
                                <div className="space-y-6 my-auto">
                                    <div className="text-center mb-6">
                                        <h3 className="text-3xl font-extrabold text-red-500">TELEVOTO DEL PUBBLICO</h3>
                                        <p className="text-gray-200 text-lg">Chi vuoi ELIMINARE dal programma?</p>
                                    </div>

                                    {publicVotes?.[user.uid] ? (
                                        <div className="text-center bg-gray-800 p-8 rounded-2xl border border-gray-700">
                                            <CheckCircle className="w-16 h-16 text-green-500 mx-auto mb-4" />
                                            <h4 className="text-2xl font-bold">Voto Registrato!</h4>
                                            <p className="text-gray-400 mt-2">In attesa degli altri giocatori...</p>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 max-w-3xl mx-auto">
                                            {nominees.map(c => (
                                                <div 
                                                    key={c.id} 
                                                    onClick={() => submitPublicVote(c.id)}
                                                    className="cursor-pointer border-2 border-red-500 bg-gradient-to-b from-gray-800 to-red-950 flex flex-col items-center p-5 rounded-2xl text-center shadow-lg hover:scale-105 transition-all"
                                                >
                                                    <img src={c.img} alt={c.name} className="w-28 h-28 rounded-xl object-cover mb-3 border-2 border-red-500" />
                                                    <span className="font-bold text-xl text-white">{c.name}</span>
                                                    <button className="mt-4 w-full bg-red-600 text-white py-2 rounded-xl font-bold shadow">
                                                        Vota x Eliminare
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                            {gameState === 'elimination_reveal' && (
                                <div className="my-auto suspense-box bg-gray-800/90 p-8 rounded-3xl border-2 border-red-500/50 text-center space-y-6">
                                    <h3 className="text-2xl font-bold text-red-400">VERDETTO DEL TELEVOTO</h3>
                                    
                                    <div className="min-h-[120px] flex flex-col justify-center items-center space-y-4">
                                        {eliminationScript.slice(0, scriptIndex + 1).map((step, idx) => (
                                            <p 
                                                key={idx} 
                                                className={`${idx === eliminationScript.length - 1 ? 'text-red-500 font-extrabold text-3xl animate-bounce' : 'text-lg text-gray-200'}`}
                                                dangerouslySetInnerHTML={{__html: step.content}}
                                            ></p>
                                        ))}
                                    </div>

                                    {scriptIndex >= eliminationScript.length - 1 && user.uid === lobbyData.host && (
                                        <button onClick={proceedToNextEpisode} className="mt-6 bg-gradient-to-r from-purple-600 to-pink-600 px-8 py-3 rounded-full font-extrabold text-lg shadow-xl hover:scale-105 transition-all">
                                            Prossimo Episodio
                                        </button>
                                    )}
                                </div>
                            )}

                            {gameState === 'finished' && (
                                <div className="text-center space-y-6 my-auto bg-gray-800 p-8 rounded-3xl border border-yellow-500 shadow-2xl">
                                    <Crown className="w-20 h-20 text-yellow-400 mx-auto animate-bounce" />
                                    <h2 className="text-4xl font-extrabold text-yellow-400">VINCITORE!</h2>
                                    <p className="text-2xl text-white font-bold">{cast[0]?.name}</p>
                                    <button onClick={leaveLobby} className="bg-purple-600 px-6 py-2.5 rounded-xl font-bold">Torna al Menu</button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            switch (view) {
                case 'menu': return renderMenu();
                case 'lobby': return renderLobbyRoom();
                case 'game': return renderGame();
                default: return renderMenu();
            }
        }
