const playSound = (type) => {
try {
const ctx = new (window.AudioContext || window.webkitAudioContext)();
if (type === 'heartbeat') {
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.type = 'sine';
osc.frequency.setValueAtTime(80, ctx.currentTime);
osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.25);
gain.gain.setValueAtTime(0.9, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime + 0.25);
} else if (type === 'elimination') {
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(250, ctx.currentTime);
osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 1.2);
gain.gain.setValueAtTime(1.0, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime + 1.2);
} else if (type === 'saved') {
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.type = 'triangle';
osc.frequency.setValueAtTime(440, ctx.currentTime);
osc.frequency.setValueAtTime(660, ctx.currentTime + 0.15);
gain.gain.setValueAtTime(0.6, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime + 0.4);
}
} catch(e) {}
};

const highlightNamesInText = (rawText, aliveCast) => {
let processedText = rawText;
const sortedCast = [...aliveCast].sort((a, b) => b.name.length - a.name.length);

sortedCast.forEach(c => {
const regex = new RegExp(`\\b${c.name}\\b`, 'gi');

const replacement = `
                   <span class="inline-flex flex-col items-center justify-center mx-1.5 align-middle group cursor-pointer translate-y-1">
                       <img src="${c.img}" alt="${c.name}" onerror="this.onerror=null;this.src='https://placehold.co/100x100/4c1d95/ffffff?text=${c.name}';" class="w-8 h-8 md:w-10 md:h-10 rounded-lg object-cover border border-purple-500/50 shadow-sm group-hover:scale-110 group-hover:border-purple-400 transition-all duration-300" />
                       <span class="text-[9px] md:text-[10px] font-extrabold text-gray-300 mt-0.5 leading-none uppercase tracking-tight group-hover:text-white transition-colors">${c.name}</span>
                   </span>
               `.trim().replace(/\n\s+/g, ' '); 

processedText = processedText.replace(regex, replacement);
});

processedText = processedText.replace(/<b>\s*(<span[^>]+>.*?<\/span>)\s*<\/b>/gi, '$1');

return processedText;
};

const generateEpisodeStory = async (aliveCast, immuneChar, episodeNum, pastEpisodes = [], apiKey = "") => {
const aliveNames = aliveCast.map(c => c.name).join(', ');

const historyContext = pastEpisodes.length > 0 
? pastEpisodes.slice(-3).map((ep, i) => `Riassunto Episodio precedente:\n${ep.replace(/<[^>]*>?/gm, '')}`).join("\n\n")
: "Questa è la primissima puntata. I concorrenti varcano la Porta Rossa del Grande Fratello. Nessuno si conosce bene, ma le prime impressioni sono fondamentali.";

let systemPrompt = `Sei l'autore e la voce onnipresente del "Grande Fratello". Osservi 24 ore su 24 i concorrenti rinchiusi nella Casa più spiata d'Italia.
           Cast dei concorrenti attualmente in gara: ${aliveNames}.
           Concorrente che è immune dalle nomination o preferito dal pubblico/GF in questo episodio: ${immuneChar.name}.
           
           STORICO DELLA TRAMA (MOLTO IMPORTANTE):
           ${historyContext}
           
           IL TUO COMPITO: Scrivi il riassunto della settimana nella Casa (Settimana ${episodeNum}).
           
           REGOLE TASSATIVE:
           1. CONTINUITÀ: Basati sullo "Storico della trama". Le dinamiche (amori, liti, alleanze) NON devono essere casuali, ma una conseguenza logica del passato! Usa il "Confessionale" per rivelare i veri pensieri dei concorrenti.
           2. INTERAZIONI: Scegli 3 o 4 personaggi dal cast e crea pettegolezzi, tradimenti, nuovi amori o litigi furibondi tra di loro.
           3. IMMUNITÀ: Menziona brevemente come o perché ${immuneChar.name} ha ottenuto l'immunità (es. preferito della casa, scelta del GF, ecc.).
           4. FORMATO: Restituisci SOLO IL CODICE HTML del racconto (usa solo i tag <p> e <i> per i pensieri/confessionali). 
           5. DIVIETO ASSOLUTO: EVITA categoricamente di usare il tag <b> sui nomi propri dei personaggi. NON inserire i tag \`\`\`html.`;

const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

let finalStoryText = "";

try {
if (!apiKey || apiKey.trim() === "") throw new Error("No API key provided. Using Fallback.");
const response = await fetch(apiUrl, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
contents: [{ parts: [{ text: systemPrompt }] }],
systemInstruction: { parts: [{ text: "Sei la voce del Grande Fratello. Scrivi solo l'HTML interno del racconto. Descrivi intrighi, confessionali, amori e liti nella Casa. Mantieni coerenza narrativa." }] },
generationConfig: { temperature: 0.8 }
})
});

if (!response.ok) throw new Error("API Error");

const result = await response.json();
if (result.candidates?.[0]?.content?.parts?.[0]?.text) {
let text = result.candidates[0].content.parts[0].text;
text = text.replace(/```html/gi, '').replace(/```/g, '');
finalStoryText = text;
}
} catch (e) {
console.log("Generazione racconto predefinita (offline) in corso...", e.message);
const shuffledCast = [...aliveCast].sort(() => 0.5 - Math.random());
const p1 = shuffledCast[0] ? shuffledCast[0].name : immuneChar.name;
const p2 = shuffledCast[1] ? shuffledCast[1].name : p1;

if (episodeNum === 1) {
finalStoryText = `<p><b>ATTENZIONE: Stai giocando senza API Key funzionante! Le storie saranno ripetitive.</b></p><p>La Porta Rossa si spalanca e i concorrenti entrano ufficialmente nella Casa del Grande Fratello!</p>
                   <p>Non appena varcata la soglia, la tensione era già alle stelle tra ${p1} e ${p2}, che si sono subito scontrati ferocemente per accaparrarsi il letto migliore.</p>
                   <p>A sbaragliare tutti e a guadagnarsi l'IMMUNITÀ per questa settimana è stato/a ${immuneChar.name}!</p>`;
} else {
finalStoryText = `<p><b>ATTENZIONE: Gioco offline. Nessuna continuità generata.</b></p><p>La tensione nella Casa è altissima!</p>
                   <p>Il vero terremoto della settimana è stato lo scontro in Confessionale tra ${p1} e ${p2}. La casa è spaccata, i coltelli sono affilati.</p>
                   <p>Nel frattempo, ${immuneChar.name} ha saputo giocare d'astuzia, aggiudicandosi l'Immunità per la prossima nomination!</p>`;
}
}

return highlightNamesInText(finalStoryText, aliveCast);
};

function RealityShowGame() {
const { useState, useEffect } = React;

const [user, setUser] = useState({ uid: 'user-' + Math.random().toString(36).substring(2, 7) });
const [nickname, setNickname] = useState('Giocatore');
const [geminiApiKey, setGeminiApiKey] = useState(localStorage.getItem('geminiApiKey') || 'AIzaSyBGds2K-vi7O5Whcv1wnpuZrPqwxas-rrs');
const [lobbyId, setLobbyId] = useState(null);
const [lobbyData, setLobbyData] = useState(null);
const [view, setView] = useState('menu');

const [castMode, setCastMode] = useState('random'); 
const [customSize, setCustomSize] = useState(12);
const [manualSelectedIds, setManualSelectedIds] = useState([]);

useEffect(() => {
if (isFirebaseAvailable && auth) {
auth.signInAnonymously().catch(console.error);
const unsub = auth.onAuthStateChanged(u => {
if (u) setUser(u);
});
return () => unsub();
}
}, []);

// === FUNZIONE AGGIUNTA PER L'ONLINE ===
const updateLobbyState = async (updates) => {
if (db && lobbyId) {
try {
await db.collection('lobbies').doc(lobbyId).update(updates);
} catch(e) {
console.error("Errore aggiornamento Firebase:", e);
}
} else {
// Fallback se si gioca offline
setLobbyData(prev => ({ ...prev, ...updates }));
}
};

// === LISTENER FIREBASE IN TEMPO REALE ===
useEffect(() => {
if (!isFirebaseAvailable || !db || !lobbyId) return;

const unsubscribe = db.collection('lobbies').doc(lobbyId).onSnapshot((doc) => {
if (doc.exists) {
const data = doc.data();
setLobbyData(data);

// Sposta tutti i giocatori nella schermata di gioco quando l'host avvia
if (data.status === 'playing' && view !== 'game') {
setView('game');
}
}
});

return () => unsubscribe();
}, [lobbyId, view]);

const createLobby = async () => {
if (!nickname.trim()) return alert("Inserisci un nickname!");
const newId = Math.random().toString(36).substring(2, 8).toUpperCase();
const newLobby = {
id: newId,
name: `Lobby di ${nickname}`,
host: user.uid,
status: 'waiting',
players: [{ id: user.uid, name: nickname }],
cast: [],
eliminated: [],
pastEpisodes: [],
gameState: 'lobby',
currentEpisodeNum: 1,
currentEpisodeText: '',
immuneId: null,
nominationVotes: {},
nominees: [],
publicVotes: {},
eliminationScript: [],
scriptIndex: 0,
readyForNomination: []
};

if (db) {
await db.collection('lobbies').doc(newId).set(newLobby);
} else {
setLobbyData(newLobby);
}

setLobbyId(newId);
setView('lobby');
};

const joinLobby = async (code) => {
if (!nickname.trim()) return alert("Inserisci un nickname!");
if (!code) return;

const codeUpper = code.toUpperCase();

if (db) {
const docRef = db.collection('lobbies').doc(codeUpper);
const docSnap = await docRef.get();

if (docSnap.exists) {
const data = docSnap.data();
const isAlreadyIn = data.players.some(p => p.id === user.uid);
if (!isAlreadyIn) {
await docRef.update({
players: firebase.firestore.FieldValue.arrayUnion({ id: user.uid, name: nickname })
});
}
setLobbyId(codeUpper);
setView('lobby');
} else {
alert("Lobby non trovata o codice errato!");
}
} else {
alert("Firebase offline. Impossibile unirsi.");
}
};

const leaveLobby = () => {
setLobbyId(null);
setLobbyData(null);
setView('menu');
};

const startCustomGame = async () => {
if (user.uid !== lobbyData.host) return alert("Solo l'Host può iniziare il gioco!");

let selectedCast = [];
if (castMode === 'random') {
const count = Math.min(Math.max(3, Number(customSize) || 12), FULL_CAST.length);
const shuffled = [...FULL_CAST].sort(() => 0.5 - Math.random());
selectedCast = shuffled.slice(0, count);
} else {
selectedCast = FULL_CAST.filter(c => manualSelectedIds.includes(c.id));
if (selectedCast.length < 3) {
alert("Seleziona almeno 3 concorrenti per iniziare il programma!");
return;
}
}

const updated = {
status: 'playing',
cast: selectedCast,
gameState: 'episode_generation',
currentEpisodeNum: 1
};

await updateLobbyState(updated);
generateNextEpisode(selectedCast, { ...lobbyData, ...updated });
};

const generateNextEpisode = async (currentCast, currentLobby) => {
const immuneChar = currentCast[Math.floor(Math.random() * currentCast.length)];

const text = await generateEpisodeStory(currentCast, immuneChar, currentLobby.currentEpisodeNum, currentLobby.pastEpisodes, geminiApiKey);

await updateLobbyState({
gameState: 'episode_reading',
currentEpisodeText: text,
pastEpisodes: [...(currentLobby.pastEpisodes || []), text], 
immuneId: immuneChar.id,
nominationVotes: {},
nominees: [],
publicVotes: {},
eliminationScript: [],
scriptIndex: 0,
readyForNomination: []
});
};

const processHouseNominations = () => {
if (user.uid !== lobbyData.host) return; // Solo l'host calcola le nomination

const currentCast = lobbyData.cast;
const nonImmuneCast = currentCast.filter(c => c.id !== lobbyData.immuneId);
const nominationTallies = {};
const secretVotesDetails = [];

currentCast.forEach(c => nominationTallies[c.id] = 0);

currentCast.forEach(voterChar => {
let validTargets = nonImmuneCast.filter(t => t.id !== voterChar.id);
if (validTargets.length === 0) validTargets = nonImmuneCast;
if (validTargets.length > 0) {
const randomTarget = validTargets[Math.floor(Math.random() * validTargets.length)];
nominationTallies[randomTarget.id] = (nominationTallies[randomTarget.id] || 0) + 1;
secretVotesDetails.push({ voter: voterChar.name, target: randomTarget.name });
}
});

const sortedCast = [...nonImmuneCast].sort((a, b) => nominationTallies[b.id] - nominationTallies[a.id]);

const numNominees = Math.min(3, sortedCast.length);
const selectedNominees = sortedCast.slice(0, numNominees);

updateLobbyState({
nominees: selectedNominees,
nominationTallies: nominationTallies,
gameState: 'public_voting'
});
};

const submitPublicVote = async (charId) => {
const newPublicVotes = { ...lobbyData.publicVotes, [user.uid]: charId };
await updateLobbyState({ publicVotes: newPublicVotes });

// Se l'utente è l'host, processa la chiusura automatica del televoto (logica originale mantenuta)
if (user.uid === lobbyData.host) {
closeTelevoto(newPublicVotes);
}
};

const closeTelevoto = (publicVotesObj) => {
const voteCounts = {};
lobbyData.nominees.forEach(c => voteCounts[c.id] = 0);

Object.values(publicVotesObj).forEach(votedId => {
if (voteCounts[votedId] !== undefined) {
voteCounts[votedId]++;
}
});

const sortedNominees = [...lobbyData.nominees].sort((a, b) => voteCounts[b.id] - voteCounts[a.id]);
const maxVotes = voteCounts[sortedNominees[0].id];
const tiedForFirst = sortedNominees.filter(c => voteCounts[c.id] === maxVotes);
const trulySaved = sortedNominees.filter(c => voteCounts[c.id] < maxVotes);

const isTie = tiedForFirst.length > 1;

} else {

if (savedNominees.length === 2) {
script.push({ type: 'text', content: `✨ Il primo concorrente SALVO è... <b>${savedNominees[0].name.toUpperCase()}</b>!`, sound: 'saved' });

script.push({ type: 'text', content: "Solo uno di voi due continuerà l'avventura.", sound: 'heartbeat' });
script.push({ type: 'text', content: "Il pubblico ha deciso che ad abbandonare PER SEMPRE il reality show è...", sound: 'heartbeat' });
script.push({ type: 'text', content: `💥 <b>${eliminatedChar.name.toUpperCase()}</b>... SEI ELIMINATO/A!`, sound: 'elimination' });

updateLobbyState({

useEffect(() => {
let timer;
if (lobbyData && lobbyData.gameState === 'elimination_reveal' && user.uid === lobbyData.host) {
if (lobbyData.scriptIndex < lobbyData.eliminationScript.length - 1) {
timer = setTimeout(() => {
const nextIndex = lobbyData.scriptIndex + 1;
updateLobbyState({ scriptIndex: nextIndex });
}, 3000);
}
}

// Per i client che non sono host, eseguiamo i suoni in base all'indice
if (lobbyData && lobbyData.gameState === 'elimination_reveal' && lobbyData.eliminationScript) {
const currentStep = lobbyData.eliminationScript[lobbyData.scriptIndex];
if (currentStep && currentStep.sound) {
playSound(currentStep.sound);
}
}

return () => clearTimeout(timer);
}, [lobbyData?.gameState, lobbyData?.scriptIndex]);

const proceedToNextEpisode = () => {
if (user.uid !== lobbyData.host) return; // Solo l'host gestisce i cambi turno

const eliminatedChar = lobbyData.cast.find(c => c.id === lobbyData.pendingEliminatedId);
const newCast = lobbyData.cast.filter(c => c.id !== lobbyData.pendingEliminatedId);
const newEliminated = [...lobbyData.eliminated, eliminatedChar];

if (newCast.length <= 1) {
updateLobbyState({
gameState: 'finished',
cast: newCast,
eliminated: newEliminated
});
} else {
const nextNum = lobbyData.currentEpisodeNum + 1;
const updated = {
gameState: 'episode_generation',
cast: newCast,
eliminated: newEliminated,
currentEpisodeNum: nextNum
};
updateLobbyState(updated);
generateNextEpisode(newCast, { ...lobbyData, ...updated });
}
};

const renderMenu = () => (
<div className="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-black text-white p-6 font-sans">
<div className="bg-white/10 p-8 rounded-3xl backdrop-blur-md shadow-2xl max-w-md w-full border border-white/20 text-center">
<Crown className="w-16 h-16 mx-auto mb-4 text-yellow-400 drop-shadow-[0_0_15px_rgba(250,204,21,0.8)]" />
<h1 className="text-4xl font-extrabold mb-2 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-pink-500">REALITY SHOW</h1>
<p className="text-gray-300 mb-6 text-sm">Decidi le sorti del cast. Tu sei il pubblico sovrano!</p>

<div className="space-y-4 mb-6">
<input 
type="text" 
placeholder="Il tuo Nickname..." 
className="w-full bg-black/30 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all"
value={nickname}
onChange={(e) => setNickname(e.target.value)}
/>

<div className="text-left">
<label className="text-xs text-purple-300 font-bold ml-1 mb-1 block">Google Gemini API Key (Per storie IA dinamiche):</label>
<input 
type="password" 
placeholder="Incolla qui la tua API Key gratuita" 
className="w-full bg-black/50 border border-purple-500/30 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all text-sm"
value={geminiApiKey}
onChange={(e) => {
setGeminiApiKey(e.target.value);
localStorage.setItem('geminiApiKey', e.target.value);
}}
/>
<p className="text-[10px] text-gray-400 mt-1 ml-1">Richiedila gratuitamente su Google AI Studio per avere trame che continuano di puntata in puntata!</p>
</div>
</div>

<div className="space-y-4 border-t border-white/10 pt-6">
<button onClick={createLobby} className="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 py-3 rounded-xl font-bold shadow-lg transform hover:scale-105 transition-all">
<Play className="w-5 h-5" /> Crea Nuova Stanza
</button>

<div className="flex gap-2">
<input id="joinCode" type="text" placeholder="Codice Stanza" className="w-2/3 bg-black/30 border border-white/20 rounded-xl px-4 py-3 text-white text-center uppercase" />
<button onClick={() => joinLobby(document.getElementById('joinCode').value)} className="w-1/3 bg-white/20 hover:bg-white/30 py-3 rounded-xl font-bold transition-all">
Unisciti
</button>
</div>
</div>
</div>
</div>
);

const renderLobbyRoom = () => {
if (!lobbyData) return null;

return (
<div className="flex flex-col items-center justify-center min-h-screen bg-gray-900 text-white p-6">
<div className="bg-gray-800 p-8 rounded-3xl shadow-2xl max-w-2xl w-full border border-gray-700">
<div className="flex justify-between items-start mb-6">
<div>
<h2 className="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600">{lobbyData.name}</h2>
<p className="text-gray-400 mt-1">Codice Stanza: <span className="font-mono text-white bg-black/50 px-2 py-1 rounded">{lobbyData.id}</span></p>
</div>
<button onClick={leaveLobby} className="text-red-400 hover:text-red-300 flex items-center gap-1"><LogOut className="w-4 h-4"/> Esci</button>
</div>

<div className="mb-8">
<h3 className="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">Giocatori Connessi ({lobbyData.players.length})</h3>
<div className="flex flex-wrap gap-3">
{lobbyData.players.map(p => (
<div key={p.id} className="bg-gray-700/50 px-4 py-2 rounded-full flex items-center gap-2 border border-gray-600">
{p.id === lobbyData.host && <Crown className="w-4 h-4 text-yellow-400"/>}
{p.name} {p.id === user.uid && "(Tu)"}
</div>
))}
</div>
</div>

<div className="bg-purple-900/30 p-6 rounded-2xl border border-purple-500/30 space-y-6">
<h3 className="text-xl font-bold text-purple-200 text-center">Configura il Cast</h3>

<div className="flex bg-black/40 p-1.5 rounded-xl border border-purple-500/30">
<button 
onClick={() => setCastMode('random')}
className={`flex-1 py-2.5 rounded-lg font-bold transition-all text-sm flex items-center justify-center gap-2 ${castMode === 'random' ? 'bg-purple-600 text-white shadow-lg' : 'text-gray-400 hover:text-white'}`}
>
🎲 Casuale (Scegli la quantità)
</button>
<button 
onClick={() => {
setCastMode('manual');
if (manualSelectedIds.length === 0) {
setManualSelectedIds(FULL_CAST.map(c => c.id));
}
}}
className={`flex-1 py-2.5 rounded-lg font-bold transition-all text-sm flex items-center justify-center gap-2 ${castMode === 'manual' ? 'bg-purple-600 text-white shadow-lg' : 'text-gray-400 hover:text-white'}`}
>
🖐️ Manuale (Scegli i personaggi)
</button>
</div>

{castMode === 'random' ? (
<div className="space-y-4">
<div className="flex justify-between items-center text-sm">
<label className="font-semibold text-gray-300">Numero di Concorrenti:</label>
<span className="font-mono text-xl font-bold text-purple-300 bg-purple-950/80 px-3 py-1 rounded-lg border border-purple-500/40">
{customSize} / {FULL_CAST.length}
</span>
</div>

<input 
type="range" 
min="3" 
max={FULL_CAST.length} 
value={customSize} 
onChange={(e) => setCustomSize(Number(e.target.value))}
className="w-full accent-purple-500 cursor-pointer h-2 bg-gray-700 rounded-lg"
/>

<div className="flex gap-2 pt-1">
{[6, 12, 18, 24, FULL_CAST.length].map(num => (
<button
key={num}
onClick={() => setCustomSize(num)}
className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all border ${customSize === num ? 'bg-purple-600 border-purple-400 text-white shadow' : 'bg-black/30 border-gray-700 text-gray-400 hover:bg-black/50 hover:text-white'}`}
>
{num === FULL_CAST.length ? 'Tutti (38)' : num}
</button>
))}
</div>
</div>
) : (
<div className="space-y-4">
<div className="flex justify-between items-center text-sm">
<span className="font-semibold text-gray-300">
Concorrenti Selezionati: <b className="text-purple-300 font-mono text-base">{manualSelectedIds.length}</b> / {FULL_CAST.length}
</span>
<div className="flex gap-2">
<button 
onClick={() => setManualSelectedIds(FULL_CAST.map(c => c.id))}
className="text-xs bg-purple-950 hover:bg-purple-900 border border-purple-500/40 px-2.5 py-1 rounded-md text-purple-300 transition-all font-semibold"
>
Seleziona Tutti
</button>
<button 
onClick={() => setManualSelectedIds([])}
className="text-xs bg-gray-800 hover:bg-gray-700 border border-gray-600 px-2.5 py-1 rounded-md text-gray-300 transition-all font-semibold"
>
Deseleziona
</button>
</div>
</div>

<div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5 max-h-64 overflow-y-auto custom-scrollbar p-2 bg-black/40 rounded-xl border border-gray-700">
{FULL_CAST.map(c => {
const isSelected = manualSelectedIds.includes(c.id);
return (
<div 
key={c.id}
onClick={() => {
if (isSelected) {
setManualSelectedIds(prev => prev.filter(id => id !== c.id));
} else {
setManualSelectedIds(prev => [...prev, c.id]);
}
}}
className={`flex items-center gap-2 p-2 rounded-xl cursor-pointer transition-all border select-none ${isSelected ? 'bg-purple-900/70 border-purple-400 text-white shadow-md' : 'bg-gray-800/40 border-gray-700/50 text-gray-400 opacity-60 hover:opacity-100'}`}
>
<img src={c.img} alt={c.name} className="w-8 h-8 rounded-lg object-cover" onError={(e) => e.target.src = `https://placehold.co/100x100/4c1d95/ffffff?text=${c.name}`} />
<span className="text-xs font-bold truncate">{c.name}</span>
</div>
);
})}
</div>
</div>
)}

<button 
onClick={startCustomGame} 
disabled={castMode === 'manual' && manualSelectedIds.length < 3}
className={`w-full py-4 rounded-xl font-extrabold text-lg shadow-xl flex items-center justify-center gap-2 transition-all ${
                                       castMode === 'manual' && manualSelectedIds.length < 3 
                                           ? 'bg-gray-700 text-gray-500 cursor-not-allowed' 
                                           : 'bg-gradient-to-r from-purple-600 via-pink-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white hover:scale-[1.02]'
                                   }`}
>
<Play className="w-5 h-5 fill-current" /> Avvia Reality Show ({castMode === 'random' ? customSize : manualSelectedIds.length} Concorrenti)
</button>
</div>
</div>
</div>
);
};

const renderGame = () => {
if (!lobbyData) return null;
const { gameState, currentEpisodeNum, cast, eliminated, currentEpisodeText, immuneId, nominees, publicVotes, scriptIndex, eliminationScript } = lobbyData;

return (
<div className="flex flex-col h-screen bg-gray-900 text-white overflow-hidden">
{/* Cast Bar */}
<div className="bg-gray-800/90 backdrop-blur-md border-b border-gray-700 p-3 shadow-lg">
<div className="max-w-6xl mx-auto flex items-center justify-between gap-2 mb-2">
<div className="flex items-center gap-2">
<Users className="w-5 h-5 text-purple-400" />
<span className="font-bold text-sm text-purple-300">Cast in Gara ({cast.length})</span>
</div>
{eliminated.length > 0 && (
<div className="text-xs text-red-400 font-semibold flex items-center gap-1">
<Skull className="w-4 h-4" /> Eliminati: {eliminated.length}
</div>
)}
</div>
<div className="flex items-center gap-3 overflow-x-auto pb-2 custom-scrollbar max-w-6xl mx-auto">
{cast.map(c => {
const isImmune = c.id === immuneId;
const isNominated = nominees && nominees.some(n => n.id === c.id);
return (
<div key={c.id} className="flex-shrink-0 flex flex-col items-center group relative">
<div className={`relative w-12 h-12 rounded-xl overflow-hidden border-2 ${isImmune ? 'border-yellow-400 ring-2 ring-yellow-400/50' : isNominated ? 'border-red-500 ring-2 ring-red-500/80 shadow-[0_0_12px_rgba(239,68,68,0.9)]' : 'border-gray-600'} shadow-md transition-transform group-hover:scale-105`}>
<img src={c.img} alt={c.name} className="w-full h-full object-cover" onError={(e) => e.target.src = `https://placehold.co/100x100/4c1d95/ffffff?text=${c.name}`} />
{isImmune && (
<div className="absolute top-0 right-0 bg-yellow-500 p-0.5 rounded-bl z-10">
<Crown className="w-3 h-3 text-black fill-black" />
</div>
)}
</div>
<span className={`text-[10px] font-medium truncate max-w-[56px] text-center mt-1 group-hover:text-white ${isNominated ? 'text-red-400 font-bold drop-shadow-[0_0_2px_rgba(239,68,68,0.8)]' : 'text-gray-300'}`}>
{c.name}
</span>
</div>
);
})}
</div>
</div>

{/* Main Stage */}
<div className="flex-1 flex flex-col h-full overflow-y-auto relative p-6 max-w-4xl mx-auto w-full">
{gameState === 'episode_generation' && (
<div className="flex flex-col items-center justify-center my-auto text-center">
<RefreshCw className="w-12 h-12 text-purple-500 animate-spin mb-4" />
<h3 className="text-xl font-bold">Generazione Episodio {currentEpisodeNum}...</h3>
<p className="text-gray-400 mt-2">Gemini sta scrivendo un racconto succoso e scandaloso!</p>
</div>
)}

{gameState === 'episode_reading' && (
<div className="space-y-6 my-auto">
<h2 className="text-2xl font-bold text-purple-400">{currentEpisodeNum === 1 ? 'Settimana 1 - Ingresso nella Casa!' : `Riassunto della Settimana ${currentEpisodeNum}`}</h2>
<div className="story-text bg-gray-800 p-5 rounded-2xl border border-gray-700 font-serif text-sm md:text-base text-gray-200" dangerouslySetInnerHTML={{__html: currentEpisodeText}}></div>

<div className="bg-gray-800/80 p-4 rounded-xl border border-gray-700 flex flex-col items-center gap-3 mt-8">
<p className="text-gray-300 font-semibold text-sm">
Giocatori pronti per le nomination: <span className="text-white font-bold">{lobbyData.readyForNomination?.length || 0} / {lobbyData.players.length}</span>
</p>
<button 
onClick={() => {
const currentReady = lobbyData.readyForNomination || [];
let newReady = [...currentReady];

if (newReady.includes(user.uid)) {
newReady = newReady.filter(id => id !== user.uid);
} else {
newReady.push(user.uid);
}

if (newReady.length >= lobbyData.players.length) {
updateLobbyState({ gameState: 'house_nomination', readyForNomination: [] });
} else {
updateLobbyState({ readyForNomination: newReady });
}
}} 
className={`w-full py-4 rounded-xl font-bold text-xl transition-all shadow-lg flex justify-center items-center gap-2 ${
                                               (lobbyData.readyForNomination || []).includes(user.uid)
                                               ? 'bg-green-600 hover:bg-green-500 text-white border-b-4 border-green-800 transform translate-y-1'
                                               : 'bg-gradient-to-r from-purple-600 to-indigo-600 hover:scale-[1.02] border-b-4 border-purple-800'
                                           }`}
>
{(lobbyData.readyForNomination || []).includes(user.uid) ? 'Pronto (In attesa...)' : 'Sono Pronto per le Nomination!'} 
{(lobbyData.readyForNomination || []).includes(user.uid) ? <CheckCircle className="w-6 h-6" /> : <ArrowRight className="w-6 h-6" />}
</button>
</div>
</div>
)}

{gameState === 'house_nomination' && (
<div className="space-y-6 my-auto text-center bg-gray-800 p-8 rounded-3xl border border-gray-700 shadow-2xl">
<Users className="w-16 h-16 text-purple-400 mx-auto" />
<h3 className="text-3xl font-extrabold text-purple-300">CONFESSIONALE SEGRETO DELLA CASA</h3>
<p className="text-gray-300 max-w-xl mx-auto">I concorrenti stanno entrando uno ad uno nel confessionale per votarsi a vicenda in gran segreto. Nessuno di loro sa chi verrà nominato!</p>

<div className="p-4 bg-purple-950/50 rounded-2xl border border-purple-500/30 text-sm text-purple-200">
💡 <b>Regola del Pubblico:</b> Votano solo i concorrenti della casa tra di loro! I più votati finiranno al tuo giudizio al Televoto!
</div>

{user.uid === lobbyData.host ? (
<button onClick={processHouseNominations} className="w-full py-4 bg-gradient-to-r from-pink-600 to-purple-600 rounded-xl font-bold text-xl hover:scale-[1.02] transition-all shadow-lg flex items-center justify-center gap-2">
Scopri i Nominati della Casa <ArrowRight />
</button>
) : (
<p className="text-purple-400 mt-4 animate-pulse">In attesa che l'Host processi le nomination...</p>
)}
</div>
)}

{gameState === 'public_voting' && (
<div className="space-y-6 my-auto">
<div className="text-center mb-6">
<h3 className="text-3xl font-extrabold text-red-500">TELEVOTO DEL PUBBLICO</h3>
<p className="text-gray-200 text-lg">La casa ha fatto le sue scelte! Ecco i 3 concorrenti a rischio. <b>Chi vuoi ELIMINARE dal programma?</b></p>
</div>

{publicVotes[user.uid] ? (
<div className="text-center bg-gray-800 p-8 rounded-2xl border border-gray-700">
<CheckCircle className="w-16 h-16 text-green-500 mx-auto mb-4" />
<h4 className="text-2xl font-bold">Voto Registrato con successo!</h4>
<p className="text-gray-400 mt-2">In attesa che gli altri giocatori votino...</p>
</div>
) : (
<div className="grid grid-cols-1 sm:grid-cols-3 gap-6 max-w-3xl mx-auto">
{nominees.map(c => (
<div 
key={c.id} 
onClick={() => submitPublicVote(c.id)}
className="relative cursor-pointer group rounded-2xl overflow-hidden border-2 border-red-500 hover:border-red-400 hover:scale-105 transition-all shadow-[0_0_20px_rgba(220,38,38,0.4)] hover:shadow-[0_0_30px_rgba(220,38,38,0.7)] bg-gradient-to-b from-gray-800 to-red-950 flex flex-col items-center p-5 text-center"
>
<div className="absolute inset-0 bg-gradient-to-tr from-red-600/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
<img src={c.img} alt={c.name} className="w-32 h-32 rounded-xl object-cover mb-3 shadow-[0_0_15px_rgba(0,0,0,0.5)] border-2 border-red-500/50 relative z-10" onError={(e) => e.target.src = `https://placehold.co/150x150/1f2937/ffffff?text=${c.name}`} />
<span className="font-extrabold text-2xl text-white drop-shadow-md relative z-10">{c.name}</span>
<span className="text-xs text-white font-black tracking-wider uppercase mt-2 bg-gradient-to-r from-red-600 to-red-400 px-4 py-1.5 rounded-full shadow-[0_0_15px_rgba(239,68,68,0.6)] relative z-10 animate-pulse">IN NOMINATION</span>
<button className="mt-5 w-full bg-gradient-to-r from-red-700 to-red-500 hover:from-red-600 hover:to-red-400 text-white py-3 rounded-xl font-bold shadow-lg transition-all transform group-hover:-translate-y-1 relative z-10 border border-red-400/50">
Vota x Eliminare
</button>
</div>
))}
</div>
)}
</div>
)}

{gameState === 'elimination_reveal' && (
<div className="my-auto suspense-box bg-gray-800/90 backdrop-blur-lg p-8 rounded-3xl border-2 border-red-500/50 text-center space-y-6 shadow-2xl">
<h3 className="text-2xl font-bold text-red-400 uppercase tracking-widest border-b border-red-500/30 pb-3">IL VERDETTO DEL PUBBLICO</h3>

<div className="flex justify-center gap-4 md:gap-8 my-6">
{nominees.map(c => {
const isRevealPhase = scriptIndex >= eliminationScript.length - 1;
const isEliminated = c.id === lobbyData.pendingEliminatedId;
const isSafeNow = isRevealPhase && !isEliminated;

return (
<div key={c.id} className={`flex flex-col items-center transition-all duration-700 ${isRevealPhase && isEliminated ? 'scale-110 z-10' : isSafeNow ? 'opacity-40 scale-90 grayscale' : 'scale-100 animate-pulse'}`}>
<div className={`w-20 h-20 md:w-28 md:h-28 rounded-2xl overflow-hidden border-4 shadow-xl transition-colors duration-500 ${isRevealPhase && isEliminated ? 'border-red-600 shadow-[0_0_30px_rgba(220,38,38,0.9)]' : isSafeNow ? 'border-green-500' : 'border-gray-500'}`}>
<img src={c.img} alt={c.name} className="w-full h-full object-cover" onError={(e) => e.target.src = `https://placehold.co/150x150/1f2937/ffffff?text=${c.name}`} />
</div>
<span className={`mt-3 font-extrabold uppercase tracking-wide transition-colors ${isRevealPhase && isEliminated ? 'text-red-500 text-xl' : isSafeNow ? 'text-green-500 text-sm' : 'text-gray-300'}`}>
{c.name}
</span>
</div>
)
})}
</div>

<div className="min-h-[160px] flex flex-col justify-center items-center space-y-4">
{eliminationScript.slice(0, scriptIndex + 1).map((step, idx) => (
<p 
key={idx} 
className={`transition-all duration-500 ${idx === scriptIndex ? 'scale-110' : 'opacity-50'} ${idx === eliminationScript.length - 1 ? 'text-red-500 font-extrabold text-3xl md:text-4xl mt-4 animate-bounce' : 'text-lg md:text-2xl font-serif text-gray-100'}`}
dangerouslySetInnerHTML={{__html: step.content}}
></p>
))}
</div>

{scriptIndex >= eliminationScript.length - 1 && user.uid === lobbyData.host && (
<button onClick={proceedToNextEpisode} className="mt-8 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 px-10 py-4 rounded-full font-extrabold text-lg shadow-xl hover:scale-105 transition-all">
Prosegui al Prossimo Episodio
</button>
)}
</div>
)}

{gameState === 'finished' && (
<div className="text-center space-y-6 my-auto bg-gray-800 p-8 rounded-3xl border border-yellow-500 shadow-2xl">
<Crown className="w-24 h-24 text-yellow-400 mx-auto animate-bounce" />
<h2 className="text-4xl md:text-5xl font-extrabold text-yellow-400">ABBIAMO UN VINCITORE!</h2>
<p className="text-2xl md:text-3xl text-gray-200">Trionfa la stagione: <span className="font-extrabold text-white bg-purple-600/50 px-4 py-1 rounded-xl">{cast[0]?.name}</span>!</p>
<button onClick={leaveLobby} className="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 px-8 py-3 rounded-xl font-bold text-lg shadow-lg">Torna al Menu</button>
</div>
)}
</div>
</div>
);
};

switch (view) {
case 'menu': return renderMenu();
case 'lobby': return renderLobbyRoom();
case 'game': return renderGame();
default: return renderMenu();
}
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<RealityShowGame />);
</script>
</body>
